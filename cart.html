<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Корзина</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="header__container">

    <img src="Fenderlogo.png" class="header__logo-image">

    <div class="header__right">

  <form class="search-form" onsubmit="searchModel(event)">
    
    <div class="search-wrapper">
        <input 
            id="searchInput"
            class="search-form__input"
            type="text"
            placeholder="Поиск..."
        >

        <button type="button" class="search-clear" onclick="clearSearch()">
            ✕
        </button>
    </div>

    <button class="search-form__button">
        Найти
    </button>

  </form>

  <nav class="header__nav">
    <a href="index.html">Главная</a>
    <a href="catalog.html">Каталог</a>
    <a href="cart.html">
      Корзина (<span class="cart-count">0</span>)
    </a>
  </nav>

</div>

  </div>
</header>

<main>

<h2 class="title">Корзина</h2>

<p id="empty-cart" class="empty-cart">
  Корзина пуста
</p>

<div id="cart-items"></div>

<div class="cart__bottom">

  <div class="cart__center">
    <div id="cart-total">Итого: 0 ₽</div>

    <button class="cart__checkout">
      Оформить заказ
    </button>
  </div>

  <button class="cart__clear" onclick="clearCart()">
    Очистить корзину
  </button>

</div>

</main>

<script src="script.js"></script>

<footer class="footer">

  <div class="footer__content">

    <div class="footer__section">
      <h3>Fender Shop</h3>
      <p>Оригинальные гитары Fender</p>
    </div>

    <div class="footer__section">
      <h3>Контакты</h3>
      <p>Email: info@fendershop.ru</p>
      <a href="https://www.instagram.com/fender/" target="_blank">
        Instagram
      </a>
    </div>

    <div class="footer__section">
      <h3>Навигация</h3>
      <a href="index.html">Главная</a>
      <a href="catalog.html">Каталог</a>
    </div>

  </div>

  <div class="footer__bottom">
    © 2026 Fender Shop<br>Все права защищены
  </div>

</footer>
</body>
</html>
