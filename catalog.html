<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="header__container">

    <img src="Fenderlogo.png" class="header__logo-image">

    <nav class="header__nav">
      <a href="index.html">Главная</a>
      <a href="catalog.html">Каталог</a>
      <a href="cart.html">Корзина (<span class="cart-count">0</span>)</a>
    </nav>

  </div>
</header>

<main>

<h2 class="title">Категории</h2>

<div class="catalog-menu">

    <button
        onmouseenter="renderCategories('models')">
        Модели
    </button>

    <button
        onmouseenter="renderCategories('bass')">
        Бас
    </button>

    <button
        onmouseenter="renderCategories('squier')">
        Squier
    </button>

</div>

<div class="categories" id="categories"></div>
<h2 class="title">Каталог</h2>

<div class="catalog__controls">
  <select id="sortSelect" onchange="sortCatalog()">
    <option value="default">По умолчанию</option>
    <option value="asc">По возрастанию цены</option>
    <option value="desc">По убыванию цены</option>
  </select>
</div>

<div class="catalog__list" id="catalog"></div>

</main>

<script src="script.js"></script>
<footer class="footer">

  <div class="footer__content">

    <div class="footer__section">
      <h3>Fender Shop</h3>
      <p>Оригинальные гитары Fender</p>
    </div>

    <div class="footer__section">
      <h3>Контакты</h3>
      <p>Email: info@fendershop.ru</p>
      <a href="https://www.instagram.com/fender/" target="_blank">
        Instagram
      </a>
    </div>

    <div class="footer__section">
      <h3>Навигация</h3>
      <a href="index.html">Главная</a>
      <a href="catalog.html">Каталог</a>
    </div>

  </div>

  <div class="footer__bottom">
    © 2026 Fender Shop<br>Все права защищены
  </div>

</footer>
</body>
</html>
