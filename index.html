<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fender Shop</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="header__container">

    <img src="Fenderlogo.png" class="header__logo-image">

    <nav class="header__nav">
      <a href="index.html">Главная</a>
      <a href="catalog.html">Каталог</a>
      <a href="cart.html">Корзина (<span class="cart-count">0</span>)</a>
    </nav>

  </div>
</header>

<section class="banner">
  <img src="Banner.png" class="banner__image">

<div class="banner__content">
  <h2>Оригинальные гитары Fender</h2>
  <p class="banner__sub">Est. 1946</p>
  <a href="catalog.html" class="banner__button">К покупкам</a>
</div>
</section>

<main>

<div class="section-title">
    <h2 class="title">Лучшие модели</h2>
</div>

<div class="models">

  <a href="catalog.html?type=Jaguar" class="model-card">
    <img src="Jaguar.jpg" class="model-card__image">
    <div class="model-card__text">Jaguar</div>
  </a>

  <a href="catalog.html?type=Jazzmaster" class="model-card">
    <img src="Jazzmaster.jpg" class="model-card__image">
    <div class="model-card__text">Jazzmaster</div>
  </a>

  <a href="catalog.html?type=Telecaster" class="model-card">
    <img src="Telecaster.jpg" class="model-card__image">
    <div class="model-card__text">Telecaster</div>
  </a>

  <a href="catalog.html?type=Stratocaster" class="model-card">
    <img src="Stratocaster.jpg" class="model-card__image">
    <div class="model-card__text">Stratocaster</div>
  </a>

</div>

</main>

<script src="script.js"></script>

<footer class="footer">

  <div class="footer__content">

    <div class="footer__section">
      <h3>Fender Shop</h3>
      <p>Оригинальные гитары Fender</p>
    </div>

    <div class="footer__section">
      <h3>Контакты</h3>
      <p>Email: info@fendershop.ru</p>
      <a href="https://www.instagram.com/fender/" target="_blank">
        Instagram
      </a>
    </div>

    <div class="footer__section">
      <h3>Навигация</h3>
      <a href="index.html">Главная</a>
      <a href="catalog.html">Каталог</a>
    </div>

  </div>

  <div class="footer__bottom">
    © 2026 Fender Shop<br>Все права защищены
  </div>

</html>
