<!DOCTYPE html>
<html lang="ru">

<title>Fender Shop</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="header__container">

    <img src="Fenderlogo.png" class="header__logo-image">

    <nav class="header__nav">
